services:
  - type: web
    name: placement-platform-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: placement_platform
      - key: CORS_ORIGIN
        sync: false
